<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack - Cute Personal Finance</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base & Variables */
        :root {
            --bg-main: #fff9fb; 
            --bg-card: #ffffff; 
            --bg-input: #f8fafc;
            
            --text-main: #334155;
            --text-muted: #64748b;
            
            --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            
            /* Warna Pastel Cute */
            --pastel-mint: #e6fcf5;
            --pastel-pink: #fff0f5;
            --pastel-blue: #f0f4ff;
            --pastel-yellow: #fffbeb;
            
            --text-mint: #059669;
            --text-pink: #e11d48;
            --text-blue: #4f46e5;
            --text-yellow: #d97706;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* =========================================
           BACKGROUND EMOJI LUCU
           ========================================= */
        .emoji-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            pointer-events: none;
            opacity: 0.15; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            padding: 1rem;
            font-size: 3.5rem;
            align-content: space-around;
            justify-items: center;
            transform: rotate(-5deg) scale(1.1); 
        }

        /* Blob Abstrak */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            z-index: -1;
            opacity: 0.6;
            animation: float 8s infinite ease-in-out alternate;
            pointer-events: none;
        }
        .blob-1 { width: 400px; height: 400px; background: var(--pastel-pink); top: -50px; left: -50px; }
        .blob-2 { width: 400px; height: 400px; background: var(--pastel-blue); bottom: -50px; right: -50px; animation-delay: -4s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Animasi Melayang untuk Emoji */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Navigasi Atas */
        .navbar {
            width: 100%;
            padding: 1.25rem 5%;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 2px dashed #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span { color: var(--text-pink); }
        
        .logo .bear {
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        /* Main Container */
        .main-container {
            width: 100%;
            flex: 1;
            padding: 2.5rem 5%;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            max-width: 1400px;
            margin: 0 auto;
            z-index: 1;
        }

        /* Ringkasan Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .stat-card {
            padding: 1.5rem;
            border-radius: 30px; 
            border: 2px solid transparent;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px) rotate(1deg);
        }

        /* Emoji Besar Transparan di Belakang Teks */
        .stat-card::after {
            content: '';
            position: absolute;
            right: -10px;
            bottom: -15px;
            font-size: 7rem;
            opacity: 0.2;
            z-index: 0;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        /* Stiker Kecil di Pojok Kanan Atas */
        .stat-card .sticker {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            opacity: 0.8;
            z-index: 1;
            animation: bounce 3s infinite ease-in-out;
        }

        .stat-card.income { background-color: var(--pastel-mint); border-color: #a7f3d0; }
        .stat-card.income::after { content: '🌱'; }
        
        .stat-card.expense { background-color: var(--pastel-pink); border-color: #fecdd3; }
        .stat-card.expense::after { content: '🍩'; }

        .stat-card.savings { background-color: var(--pastel-blue); border-color: #bfdbfe; }
        .stat-card.savings::after { content: '🐷'; }

        .stat-card.emergency { background-color: var(--pastel-yellow); border-color: #fde68a; }
        .stat-card.emergency::after { content: '🛡️'; }

        /* Ikon Bulat */
        .stat-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            background-color: #ffffff; 
            z-index: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .income .stat-icon { color: var(--text-mint); }
        .expense .stat-icon { color: var(--text-pink); }
        .savings .stat-icon { color: var(--text-blue); }
        .emergency .stat-icon { color: var(--text-yellow); }

        .stat-card h3 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 1;
        }

        .stat-card .amount {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            z-index: 1;
        }

        /* =========================================
           AREA FORM & RIWAYAT
           ========================================= */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        /* Panel Gaya Scrapbook / Cute */
        .panel {
            background-color: #ffffff;
            border-radius: 32px; 
            border: 3px dashed #cbd5e1; 
            box-shadow: 0 15px 30px -10px rgba(167, 139, 250, 0.15);
            padding: 3rem 2rem 2rem 2rem; /* Padding atas ditambah untuk pita */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Washi Tape di Atas Panel */
        .panel::before {
            content: 'Tambah Transaksi 📝';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            background-color: #fbcfe8; /* Pink pastel */
            color: #be185d;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            white-space: nowrap;
        }

        .panel:nth-child(2)::before {
            content: 'Riwayat Transaksi 🧾';
            background-color: #bfdbfe; /* Biru pastel */
            color: #1d4ed8;
            transform: translateX(-50%) rotate(2deg); /* Rotasi beda arah */
        }

        .panel-header {
            margin-bottom: 1.5rem;
            text-align: center;
            display: none; /* Disembunyikan karena judul sudah pakai Washi Tape */
        }

        /* Form Input */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 700;
            padding-left: 0.5rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .form-group input, 
        .form-group select {
            background-color: var(--bg-input);
            border: 2px solid #e2e8f0;
            color: var(--text-main);
            padding: 1rem 1.2rem;
            border-radius: 20px; 
            outline: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .form-group input:focus, 
        .form-group select:focus {
            background-color: #ffffff;
            border-color: #f472b6; 
            box-shadow: 0 0 0 4px var(--pastel-pink);
        }

        /* Tombol Simpan Cute */
        .btn-submit {
            background-color: #fbcfe8; 
            color: #be185d; 
            border: none;
            padding: 1.1rem;
            border-radius: 20px; 
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 1rem;
            box-shadow: 0 6px 0 #f472b6; 
            transform: translateY(-2px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: #f9a8d4;
            transform: translateY(0);
            box-shadow: 0 2px 0 #f472b6;
        }

        .btn-submit .sparkle {
            transition: transform 0.3s;
        }
        
        .btn-submit:hover .sparkle {
            transform: scale(1.3) rotate(15deg);
        }

        /* Riwayat Transaksi */
        .transaction-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
        }

        /* Garis Vertikal Putus-putus di Kiri */
        .transaction-list::before {
            content: '';
            position: absolute;
            left: 24px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            border-left: 2px dashed #cbd5e1;
            z-index: 0;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            padding: 1.2rem 1.5rem 1.2rem 3.5rem; /* Padding kiri untuk garis */
            border-radius: 24px; 
            border: 2px solid #f1f5f9;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            z-index: 1;
        }

        /* Titik pada Garis Putus-putus */
        .transaction-item::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #cbd5e1;
            border: 2px solid #ffffff;
        }

        .transaction-item:hover {
            transform: translateX(5px) scale(1.01);
            border-color: #e2e8f0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        /* Ganti warna titik berdasarkan tipe */
        .transaction-item.income::before { background-color: var(--text-mint); }
        .transaction-item.expense::before { background-color: var(--text-pink); }
        .transaction-item.savings::before { background-color: var(--text-blue); }
        .transaction-item.emergency::before { background-color: var(--text-yellow); }

        .tx-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .tx-desc {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .tx-type {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: capitalize;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tx-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .tx-amount {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 0.5rem 1.2rem;
            border-radius: 16px; 
        }

        .tx-amount.positive { color: var(--text-mint); background-color: var(--pastel-mint); border: 1px solid #a7f3d0; }
        .tx-amount.negative { color: var(--text-pink); background-color: var(--pastel-pink); border: 1px solid #fecdd3; }

        .btn-delete {
            background: #fff1f2;
            border: none;
            color: #fda4af;
            cursor: pointer;
            padding: 0.6rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: #fecdd3;
            color: var(--text-pink);
            transform: rotate(10deg) scale(1.1);
        }

        .btn-delete svg { width: 18px; height: 18px; }

        .btn-clear-all {
            background-color: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 1rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 2rem;
            width: 100%;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-clear-all:hover { background-color: #fecaca; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.05rem;
            padding: 3rem 0;
            font-weight: 600;
            background: #ffffff;
            border-radius: 20px;
            border: 2px dashed #e2e8f0;
        }
    </style>
</head>
<body>

    <!-- Background Emoji Pattern -->
    <div class="emoji-bg">
        <span>☕</span><span>🍩</span><span>🧸</span><span>🌸</span><span>✨</span><span>🍓</span>
        <span>🧋</span><span>🍰</span><span>🌷</span><span>🎀</span><span>🌙</span><span>🍄</span>
        <span>🍩</span><span>🧸</span><span>☕</span><span>✨</span><span>🌸</span><span>🧁</span>
        <span>🍰</span><span>🌷</span><span>🧋</span><span>🌙</span><span>🎀</span><span>🍓</span>
        <span>✨</span><span>🌸</span><span>🍩</span><span>🧸</span><span>☕</span><span>🐣</span>
        <span>🌙</span><span>🎀</span><span>🍰</span><span>🧋</span><span>🌷</span><span>🍄</span>
    </div>

    <!-- Blob Abstrak -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">FinTrack<span>.</span> <span class="bear">🧸</span></div>
    </nav>

    <!-- Main Container -->
    <main class="main-container">
        
        <!-- Ringkasan -->
        <section class="summary-grid">
            <div class="stat-card income">
                <div class="sticker">✨</div>
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </div>
                <h3>Pemasukan</h3>
                <div class="amount" id="total-income">Rp 0</div>
            </div>
            <div class="stat-card expense">
                <div class="sticker">💸</div>
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                </div>
                <h3>Pengeluaran</h3>
                <div class="amount" id="total-expense">Rp 0</div>
            </div>
            <div class="stat-card savings">
                <div class="sticker">💎</div>
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
                </div>
                <h3>Tabungan</h3>
                <div class="amount" id="total-savings">Rp 0</div>
            </div>
            <div class="stat-card emergency">
                <div class="sticker">🚨</div>
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                </div>
                <h3>Dana Darurat</h3>
                <div class="amount" id="total-emergency">Rp 0</div>
            </div>
        </section>

        <!-- Area Konten (Form & Riwayat) -->
        <section class="content-grid">
            
            <!-- Panel Form -->
            <div class="panel">
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="type">Jenis Transaksi</label>
                        <select id="type" required>
                            <option value="income">Pemasukan 🌱</option>
                            <option value="expense">Pengeluaran 🍩</option>
                            <option value="savings">Tabungan 🐷</option>
                            <option value="emergency">Dana Darurat 🛡️</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Keterangan 📝</label>
                        <input type="text" id="description" placeholder="Contoh: Beli Kopi ☕" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Nominal (Rp) 💰</label>
                        <input type="number" id="amount" placeholder="100000" min="1" required>
                    </div>
                    <button type="submit" class="btn-submit">
                        Simpan Transaksi <span class="sparkle">✨</span>
                    </button>
                </form>
            </div>

            <!-- Panel Riwayat -->
            <div class="panel">
                <ul class="transaction-list" id="transaction-list">
                    <li class="empty-state">Belum ada transaksi. Yuk mulai catat! 🌸</li>
                </ul>
                <button id="btn-clear-all" class="btn-clear-all" style="display: none;">
                    Hapus Semua Riwayat <span>🗑️</span>
                </button>
            </div>

        </section>
    </main>

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('transaction-form');
            const typeInput = document.getElementById('type');
            const descInput = document.getElementById('description');
            const amountInput = document.getElementById('amount');
            const list = document.getElementById('transaction-list');
            const btnClearAll = document.getElementById('btn-clear-all');

            const totalIncomeEl = document.getElementById('total-income');
            const totalExpenseEl = document.getElementById('total-expense');
            const totalSavingsEl = document.getElementById('total-savings');
            const totalEmergencyEl = document.getElementById('total-emergency');

            let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

            const formatRupiah = (number) => {
                return new Intl.NumberFormat('id-ID', {
                    style: 'currency',
                    currency: 'IDR',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(number);
            };

            const saveData = () => {
                localStorage.setItem('transactions', JSON.stringify(transactions));
            };

            const updateUI = () => {
                list.innerHTML = '';
                let income = 0, expense = 0, savings = 0, emergency = 0;

                if (transactions.length === 0) {
                    list.innerHTML = '<li class="empty-state">Belum ada transaksi. Yuk mulai catat! 🌸</li>';
                    btnClearAll.style.display = 'none'; 
                } else {
                    btnClearAll.style.display = 'flex'; 
                    
                    transactions.slice().reverse().forEach((tx) => {
                        if (tx.type === 'income') income += tx.amount;
                        else if (tx.type === 'expense') expense += tx.amount;
                        else if (tx.type === 'savings') savings += tx.amount;
                        else if (tx.type === 'emergency') emergency += tx.amount;

                        const li = document.createElement('li');
                        li.className = `transaction-item ${tx.type}`;
                        
                        let prefix = tx.type === 'income' ? '+ ' : '- ';
                        let amountClass = tx.type === 'income' ? 'positive' : 'negative';
                        
                        // Emoji khusus untuk tipe transaksi di riwayat
                        let typeEmoji = '';
                        if(tx.type === 'income') typeEmoji = '🌱';
                        else if(tx.type === 'expense') typeEmoji = '🍩';
                        else if(tx.type === 'savings') typeEmoji = '🐷';
                        else if(tx.type === 'emergency') typeEmoji = '🛡️';

                        const trashIcon = `
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        `;

                        li.innerHTML = `
                            <div class="tx-info">
                                <span class="tx-desc">${tx.description}</span>
                                <span class="tx-type">${typeEmoji} ${tx.type}</span>
                            </div>
                            <div class="tx-actions">
                                <div class="tx-amount ${amountClass}">
                                    ${prefix}${formatRupiah(tx.amount)}
                                </div>
                                <button class="btn-delete" onclick="deleteTransaction(${tx.id})" title="Hapus">
                                    ${trashIcon}
                                </button>
                            </div>
                        `;
                        list.appendChild(li);
                    });
                }

                totalIncomeEl.textContent = formatRupiah(income);
                totalExpenseEl.textContent = formatRupiah(expense);
                totalSavingsEl.textContent = formatRupiah(savings);
                totalEmergencyEl.textContent = formatRupiah(emergency);
            };

            window.deleteTransaction = (id) => {
                if(confirm('Yakin mau hapus catatan ini? 🥺')) {
                    transactions = transactions.filter(tx => tx.id !== id);
                    saveData();
                    updateUI();
                }
            };

            btnClearAll.addEventListener('click', () => {
                if(confirm('Yakin mau hapus SEMUA riwayat? Nanti hilang lho ya! 😭')) {
                    transactions = [];
                    saveData();
                    updateUI();
                }
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const newTransaction = {
                    id: Date.now(),
                    type: typeInput.value,
                    description: descInput.value,
                    amount: parseFloat(amountInput.value)
                };

                transactions.push(newTransaction);
                saveData();
                updateUI();
                form.reset();
            });

            updateUI();
        });
    </script>
</body>
</html>
